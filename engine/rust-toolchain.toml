# Same compiler locally and in CI (engine.yml), so a build means the same thing everywhere.
[toolchain]
channel = "1.99.1"
# wasm: the web build; android: the app (arm64 phones, armv7 low-end phones, x86_64 emulator)
targets = ["wasm32-unknown-unknown", "aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
components = ["clippy"]
