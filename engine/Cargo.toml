# CraftYap engine (Rust). Grows beside the TypeScript game until each part is proven identical and
# faster, then replaces it. See docs/ENGINE.md.
[workspace]
resolver = "2"
members = ["crates/core", "crates/wasm", "crates/client"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
