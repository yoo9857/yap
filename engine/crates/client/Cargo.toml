[package]
name = "craftyap-client"
version = "0.1.0"
description = "CraftYap native client: the shared core rendered with wgpu (Android app, desktop)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the Android app loads it (libcraftyap_client.so); rlib: the desktop binary links it
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "craftyap"
path = "src/main.rs"

[dependencies]
craftyap-core = { path = "../core" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
log = "0.4"
pollster = "1"
serde_json = "1"
image-webp = "0.2"
wgpu = "30"
winit = { version = "0.30", features = ["android-native-activity"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11"
