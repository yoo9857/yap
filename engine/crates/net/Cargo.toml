[package]
name = "craftyap-net"
version = "0.1.0"
description = "CraftYap online: the party/classroom wire protocol (mirrors the zod schemas in @robo/shared) and the WebSocket link the native client talks to the server over."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
