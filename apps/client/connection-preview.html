<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CraftYap 블록 연결 검수</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3e8;color:#30493c;font:14px/1.6 system-ui,sans-serif}header{padding:19px 24px;background:#fffdf5;border-bottom:1px solid #d6decf}h1{margin:0;font-size:23px}header p{margin:3px 0 0;color:#758474;font-size:12px}.layout{display:grid;grid-template-columns:230px 1fr;height:calc(100dvh - 100px)}aside{padding:22px;background:#fffdf5}label{display:block;margin-bottom:20px}button,select{font:inherit;color:inherit;padding:9px 11px;background:#edf0e5;border:1px solid #cbd7c3;border-radius:8px}select{width:100%;margin-top:6px}button{cursor:pointer;display:block;margin:10px 0;width:100%}button:disabled{opacity:.5;cursor:default}button:hover{background:#dce8d1}button:focus-visible,select:focus-visible{outline:3px solid #41865c;outline-offset:2px}[hidden]{display:none!important}main{position:relative;min-width:0}#connection-stage{position:absolute;inset:0}.status{position:absolute;left:20px;bottom:20px;padding:14px 18px;background:#fffdf1e8;border-radius:12px}.note{font-size:12px;color:#758474}canvas{display:block;touch-action:none}@media(max-width:650px){.layout{grid-template-columns:150px 1fr}aside{padding:12px}h1{font-size:20px}.status{left:10px;right:10px;bottom:10px;font-size:12px}}</style><header><h1>CraftYap · 옆 블록 연결</h1><p>옆면 밀착 · 잔디와 흙의 층 · 모래 낙하</p></header><div class="layout"><aside><label>배치<select id="connection-layout"><option value="soil-sand" selected>흙 + 모래 · 표면 비교</option><option value="same">나무 + 나무</option><option value="mixed">나무 + 돌</option><option value="depth">앞뒤 연결</option><option value="corner">모서리 연결</option><option value="grass-stack">잔디 3층</option><option value="dirt-stack">흙 3층</option><option value="sand">모래 받침과 낙하</option><option value="single">블록 하나</option></select></label><button id="connection-reset">다시 배치하기</button><button id="sand-release" hidden>모래 받침 제거</button><button id="connection-front">앞에서 연결선 보기</button><button id="connection-top">위에서 돌기 간격 보기</button><p class="note">드래그로 회전 · 휠로 확대<br>배치를 바꿔 연결과 층을 확인하세요.<br>모래는 받침 제거 후 아래로 떨어집니다.</p></aside><main><div id="connection-stage"></div><div class="status" id="connection-status"></div></main></div><script type="module">import{bootConnectionReview}from'/src/app/connectionReview.ts';bootConnectionReview(document.getElementById('connection-stage'));</script></html>
