<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CraftYap 채굴 연출</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f3e8;color:#30493c;font:14px/1.6 system-ui,sans-serif}header{padding:19px 24px;background:#fffdf5;border-bottom:1px solid #d6decf}h1{margin:0;font-size:23px}header p{margin:3px 0 0;color:#758474;font-size:12px}.layout{display:grid;grid-template-columns:240px 1fr;height:calc(100dvh - 100px)}aside{padding:22px;background:#fffdf5;overflow:auto}label{display:block;margin-bottom:17px}select,button{font:inherit;color:inherit;padding:9px 11px;background:#edf0e5;border:1px solid #cbd7c3;border-radius:8px}select{width:100%;margin-top:5px}button{cursor:pointer}button:hover{background:#dce8d1}button:focus-visible,select:focus-visible{outline:3px solid #41865c;outline-offset:2px}.stages{display:grid;gap:7px;margin:20px 0}.stages button{text-align:left;font-size:12px}main{position:relative;min-width:0;overflow:hidden}#mining-stage{position:absolute;inset:0}canvas{display:block;touch-action:none}.status{position:absolute;left:20px;bottom:20px;padding:14px 18px;background:#fffdf1e8;border-radius:12px;min-width:230px}.track{height:5px;background:#dce4d6;border-radius:8px;margin-top:8px;overflow:hidden}#mining-progress{height:100%;background:#64a06e;width:0}.note{font-size:11px;color:#82907d;margin-top:23px}a{color:#4c7959}@media(max-width:650px){header{padding:15px}h1{font-size:19px}.layout{grid-template-columns:155px 1fr}aside{padding:13px}button,select{font-size:11px;padding:8px}.status{min-width:0;left:10px;right:10px;bottom:10px;font-size:12px}}</style><header><h1>CraftYap · 채굴 연출</h1><p>미세한 틈 → 갈라짐·내부 단면 → 모서리 탈락 → 같은 조각의 붕괴</p></header><div class="layout"><aside><label>재료<select id="mining-material"><option value="grass">잔디·흙</option><option value="oak-log">나무 · 세로 결 쪼개짐</option><option value="oak-planks">판자 · 가로 결 쪼개짐</option><option value="iron-block">철 · 찌그러짐과 찢김</option><option value="gold-block">금속 · 휘어짐</option><option value="stone" selected>돌 · 각진 균열</option><option value="sand">모래 · 부스러짐</option><option value="glass">유리 · 얇은 파편</option><option value="white-wool">양털 · 눌림과 뜯김</option><option value="snow">눈</option><option value="dirt">흙</option><option value="diamond-block">보석</option></select></label><button id="mining-play">자동 재생</button> <button id="mining-break">부수기</button><p><button id="mining-variation">다른 균열 보기</button></p><div class="stages"><button data-stage="0">0 · 대기</button><button data-stage=".12">1 · 미세한 틈</button><button data-stage=".3">2 · 갈라짐 확산</button><button data-stage=".5">3 · 내부 단면 노출</button><button data-stage=".7">4 · 모서리 조각 탈락</button><button data-stage=".94">5 · 틈 확대·붕괴 직전</button></div><p id="mining-response" class="note"></p><p class="note">드래그로 회전 · 휠로 확대<br>게임의 실제 채굴 연출 코드를 사용합니다.<br>게임에서는 재료의 강도에 따라 속도가 달라집니다.</p><a href="/block-preview.html" id="mining-block-link">블록 검수 →</a></aside><main><div id="mining-stage"></div><div class="status"><strong id="mining-status">대기</strong><div class="track"><div id="mining-progress"></div></div></div></main></div><script type="module">import{bootMiningReview}from'/src/app/miningReview.ts';bootMiningReview(document.getElementById('mining-stage'));</script></html>
