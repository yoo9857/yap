<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>CraftYap · 아이템 동작 검수</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f4e8;color:#304731;font:14px/1.7 system-ui,sans-serif}header{padding:14px 22px;border-bottom:1px solid #bdc9ae;display:flex;align-items:center;gap:20px;justify-content:space-between}h1{margin:0;font-size:21px}.layout{display:grid;grid-template-columns:300px 1fr;height:calc(100dvh - 65px)}aside{padding:20px;overflow:auto;background:#fffdf5}main{position:relative;min-width:0}#item-stage{position:absolute;inset:0}label{display:block;margin:14px 0}select,button,input[type=range]{font:inherit;width:100%;padding:8px;background:#edf0e4;border:1px solid #b8c6ac;border-radius:8px;color:inherit}button{cursor:pointer;min-height:42px}button:hover{background:#ffe89a}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0}pre{white-space:pre-wrap;font:12px/1.9 system-ui}canvas{display:block;touch-action:none}.note{font-size:12px;color:#657a60}#item-phase{font-size:12px;min-width:180px}@media(max-width:650px){.layout{grid-template-columns:190px 1fr}aside{padding:12px}header{padding:10px;display:block}h1{font-size:18px}.layout{height:calc(100dvh - 80px)}}</style></head><body><header><h1>CraftYap · HOME / TT 아이템 동작</h1><span id="item-phase" aria-live="polite">불러오는 중</span></header><div class="layout"><aside><div class="buttons"><button data-item-view="front">정면</button><button data-item-view="left">왼쪽</button><button data-item-view="right">오른쪽</button><button data-item-view="back">뒤쪽</button></div><label>옵션<select id="item-option"></select></label><label>동작<select id="item-action"><option value="idle">대기 · 미세 호흡</option><option value="walk">걷기</option><option value="run">달리기</option><option value="turn">이동 · 방향 전환</option><option value="mine">정지 · 연속 공격</option><option value="move-attack">이동 · 연속 공격</option><option value="crawl">기어가기 · 도구 숨김</option></select></label><label>이동 속도<input id="item-speed" type="range" min="0.2" max="5" step="0.1" value="2.2"></label><div class="buttons"><button id="item-swing">한 번 공격</button><button id="item-pause" aria-pressed="false">일시정지</button></div><label><input id="item-hitbox" type="checkbox"> 앞쪽 타격 날 표시 · 검수용</label><pre id="item-stats"></pre><label>사거리 확인<input id="item-distance" type="range" min="0.5" max="3.5" step="0.1" value="2.4"></label><p id="item-distance-label">2.4m · 유효 거리 안</p><p class="note">실제 캐릭터·장착·동작 코드를 사용한 제자리 검수입니다.<br>드래그 회전 · 휠 확대<br>게임에서는 H 장착, Shift+H 옵션<br>조준 거리·정면 각도 안의 첫 블록만 타격합니다. 주황 원은 광역 판정이 아닌 검수 표시입니다.</p></aside><main><div id="item-stage"></div></main></div><script type="module">import{bootItemReview}from'/src/app/itemReview.ts';bootItemReview(document.getElementById('item-stage'));</script></body></html>
