    <style>
      /* ---------------------------------------------------------------
         CraftYap doodle design language
         - white "sticker" cards with thick ink outlines
         - wobbly hand-drawn corners (asymmetric border-radius)
         - hard offset shadows, crayon palette, slight sticker tilts
         --------------------------------------------------------------- */
      :root {
        --ink: #1f1f1f;
        --paper: #ffffff;
        --paper-dim: #f6f1e6;
        --cy-yellow: #ffd21c;
        --cy-blue: #2f7de1;
        --cy-green: #52b84d;
        --cy-red: #ef3a5d;
        --cy-purple: #8a4fd7;
        --cy-orange: #f5802b;
        --wobble-lg: 24px 20px 26px 18px / 20px 26px 18px 24px;
        --wobble-md: 14px 18px 12px 16px / 16px 12px 18px 14px;
        --wobble-sm: 10px 13px 9px 12px / 12px 9px 13px 10px;
        --shadow-hard: 4px 5px 0 rgba(31, 31, 31, 0.85);
        --shadow-soft: 3px 3px 0 rgba(31, 31, 31, 0.8);
        --menu-background: url("/backgrounds/craftyap-sunny-village-desktop.webp");
      }
      @supports (background-image: image-set(url("data:,") type("image/avif"))) {
        :root {
          --menu-background: image-set(
            "/backgrounds/craftyap-sunny-village-desktop.avif" type("image/avif"),
            "/backgrounds/craftyap-sunny-village-desktop.webp" type("image/webp")
          );
        }
      }
      @media (max-width: 767px) {
        :root {
          --menu-background: url("/backgrounds/craftyap-sunny-village-mobile.webp");
        }
        @supports (background-image: image-set(url("data:,") type("image/avif"))) {
          :root {
            --menu-background: image-set(
              "/backgrounds/craftyap-sunny-village-mobile.avif" type("image/avif"),
              "/backgrounds/craftyap-sunny-village-mobile.webp" type("image/webp")
            );
          }
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #7ec8f0;
        font-family: "Jua", system-ui, -apple-system, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        touch-action: none;
      }
      #boot-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #9bd7ec var(--menu-background) center / cover no-repeat;
        color: var(--ink);
        z-index: 100;
        transition: opacity 0.3s;
        font-size: 18px;
        text-shadow:
          0 0 6px #fff,
          0 0 12px #fff;
      }
      #boot-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot-overlay .spinner {
        width: 52px;
        height: 52px;
        border: 6px solid var(--ink);
        border-top-color: var(--cy-yellow);
        border-radius: 47% 53% 51% 49% / 52% 48% 52% 48%;
        animation: spin 0.9s linear infinite;
        background: var(--paper);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot-overlay button {
        display: none;
        padding: 10px 30px;
        font-size: 17px;
        font-family: inherit;
        color: var(--paper);
        background: var(--cy-green);
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        box-shadow: var(--shadow-soft);
        cursor: pointer;
      }
      #boot-overlay.error .spinner {
        display: none;
      }
      #boot-overlay.error button {
        display: block;
      }

      /* ---------- HUD (tower) ---------- */
      .hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        pointer-events: none;
        z-index: 20;
      }
      .hud-top {
        display: flex;
        gap: 10px;
        padding: 12px 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .hud-chip {
        background: var(--paper);
        color: var(--ink);
        border: 3px solid var(--ink);
        font-size: 15px;
        padding: 4px 14px;
        border-radius: var(--wobble-sm);
        min-width: 48px;
        text-align: center;
        box-shadow: var(--shadow-soft);
      }
      .hud-chip:nth-child(odd) {
        transform: rotate(-1.2deg);
      }
      .hud-chip:nth-child(even) {
        transform: rotate(1deg);
      }
      .hud-banner {
        margin: 6px auto 0;
        width: fit-content;
        max-width: 90vw;
        background: var(--cy-orange);
        color: var(--paper);
        font-size: 14px;
        padding: 6px 16px;
        border: 3px solid var(--ink);
        border-radius: var(--wobble-sm);
        box-shadow: var(--shadow-soft);
      }
      .hidden {
        display: none !important;
      }

      /* ---------- screens ---------- */
      .screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 30;
        background: rgba(20, 30, 50, 0.35);
      }
      /* Shared artwork for the mode picker, classroom lobby and loading screen. */
      #menu-backdrop {
        position: fixed;
        inset: 0;
        z-index: 29;
        pointer-events: none;
        background: #9bd7ec var(--menu-background) center / cover no-repeat;
      }
      #menu-backdrop video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        opacity: 0;
        transition: opacity 0.25s;
      }
      .menu-video-ready #menu-backdrop video { opacity: 1; }
      .menu-video-ready .mode-screen,
      .menu-video-ready #boot-overlay { background: transparent; }
      #menu-motion-toggle {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        z-index: 101;
        padding: 8px 12px;
        border: 2px solid var(--ink);
        border-radius: var(--wobble-sm);
        background: rgba(255, 255, 255, 0.95);
        box-shadow: var(--shadow-soft);
        font: 14px "Jua", system-ui, sans-serif;
        color: var(--ink);
        cursor: pointer;
      }
      #menu-motion-toggle:focus-visible { outline: 3px solid var(--cy-blue); outline-offset: 4px; }
      .mode-screen {
        background: #9bd7ec var(--menu-background) center / cover no-repeat;
      }
      .screen-card {
        background: var(--paper) url("/textures/doodle-paper.webp");
        background-size: 280px;
        border: 4px solid var(--ink);
        border-radius: var(--wobble-lg);
        padding: 26px 32px;
        text-align: center;
        box-shadow: 6px 7px 0 rgba(31, 31, 31, 0.8);
        max-width: min(430px, 90vw);
        transform: rotate(-0.6deg);
      }
      .brand-logo {
        display: block;
        width: min(240px, 60vw);
        margin: -6px auto 2px;
      }
      .brand-logo.small {
        width: min(170px, 45vw);
      }
      .screen-card h1 {
        margin: 0 0 6px;
        font-size: 32px;
        font-weight: 400;
        color: var(--ink);
      }
      .mode-screen .screen-card {
        max-height: calc(100dvh - 32px);
        overflow-y: auto;
        box-sizing: border-box;
      }
      .screen-card .game-brand {
        margin-bottom: 4px;
        font-size: 25px;
      }
      .game-brand span {
        font: 600 14px system-ui, sans-serif;
      }
      .screen-card .game-intro {
        margin: 0 0 16px;
        font-size: 14px;
        line-height: 1.5;
        color: #5a5a5a;
        word-break: keep-all;
      }
      .mode-step h2 {
        margin: 0 0 12px;
        font-size: 21px;
        font-weight: 400;
        color: var(--ink);
      }
      .game-help { margin: 12px 0 0; }
      .creator-title {
        font-size: 25px !important;
        line-height: 1.15;
        color: var(--cy-green) !important;
      }
      .topic-pills {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 6px;
        margin: 2px 0 15px;
      }
      .topic-pills span {
        border: 2px solid var(--ink);
        border-radius: 999px;
        padding: 4px 9px;
        background: #fff9d8;
        color: var(--ink);
        font: 600 11px/1.1 system-ui, sans-serif;
      }
      .topic-pills span:nth-child(2) { background: #eaf3ff; }
      .topic-pills span:nth-child(3) { background: #fbe8f0; }
      .topic-pills span:nth-child(4) { background: #edf9ec; }
      .play-kicker {
        margin: 0 0 10px;
        color: #6a6a6a;
        font: 600 11px system-ui, sans-serif;
        letter-spacing: 0.2px;
      }
      .mode-new {
        display: inline-block;
        margin-left: 7px;
        padding: 2px 7px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--cy-yellow);
        color: var(--ink);
        font: 700 10px/1.3 system-ui, sans-serif;
        font-style: normal;
        letter-spacing: 0.4px;
        vertical-align: 2px;
      }
      .mode-btn[data-mode="craft"] {
        background: #f3fbef;
      }
      .desk-link {
        display: inline-block;
        margin-top: 4px;
        color: #6a6a6a;
        font: 600 12px system-ui, sans-serif;
        text-decoration: none;
        border-bottom: 2px dotted #bdbdbd;
      }
      .mode-back {
        padding: 0;
        border: 0;
        border-bottom: 2px dotted #bdbdbd;
        background: none;
        cursor: pointer;
      }
      .mode-btn[data-pick="field"] {
        background: #f3fbef;
        transform: rotate(-0.5deg);
      }
      .mode-btn[data-pick="games"] {
        background: #eaf3ff;
        transform: rotate(0.5deg);
      }
      .mode-btn[data-pick="games"] .mode-text b {
        color: var(--cy-green);
      }
      .desk-link:hover {
        color: var(--ink);
        border-bottom-color: var(--ink);
      }
      .screen-card .subtitle {
        margin: 0 0 16px;
        color: #5a5a5a;
        font-size: 15px;
      }
      .mode-btn {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 12px;
        padding: 13px 16px;
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        background: var(--paper);
        box-shadow: var(--shadow-soft);
        cursor: pointer;
        text-align: left;
        font-family: inherit;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      .mode-btn[data-mode="tower"] {
        background: #eaf3ff;
        transform: rotate(0.5deg);
      }
      .mode-btn[data-mode="builder"] {
        background: #edf9ec;
        transform: rotate(-0.7deg);
      }
      .mode-btn:hover {
        transform: translate(-2px, -2px);
        box-shadow: 5px 6px 0 rgba(31, 31, 31, 0.85);
      }
      .mode-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 rgba(31, 31, 31, 0.85);
      }
      .mode-emoji {
        font-size: 34px;
      }
      .mode-text b {
        display: block;
        font-size: 19px;
        font-weight: 400;
        color: var(--cy-blue);
      }
      .mode-btn[data-mode="builder"] .mode-text b {
        color: var(--cy-green);
      }
      .mode-text small {
        color: #6a6a6a;
        font-size: 12px;
        font-family: system-ui, sans-serif;
      }
      .screen-card .daily-label {
        margin: 0 0 10px;
        font-size: 14px;
        color: var(--cy-blue);
      }
      .board-empty {
        justify-content: center;
        color: #8a8a8a !important;
      }
      .title-screen .board {
        margin-top: 14px;
      }
      .screen-card input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 12px;
        padding: 10px 12px;
        font-size: 17px;
        font-family: inherit;
        color: var(--ink);
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        text-align: center;
        background: var(--paper);
      }
      .screen-card input:focus {
        outline: none;
        border-color: var(--cy-blue);
      }
      .screen-card button.primary {
        width: 100%;
        padding: 12px 0;
        font-size: 19px;
        font-family: inherit;
        color: var(--paper);
        background: var(--cy-green);
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        box-shadow: var(--shadow-hard);
        cursor: pointer;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      .screen-card button.primary:hover {
        transform: translate(-1px, -1px);
        box-shadow: 5px 6px 0 rgba(31, 31, 31, 0.85);
      }
      .screen-card button.primary:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 rgba(31, 31, 31, 0.85);
      }
      .screen-card .help {
        margin: 14px 0 0;
        font-size: 12px;
        font-family: system-ui, sans-serif;
        color: #8a8a8a;
      }
      .board {
        margin: 0 0 14px;
        max-height: 180px;
        overflow-y: auto;
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        background: var(--paper-dim);
        padding: 4px;
      }
      .board-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
        padding: 4px 10px;
        border-radius: 8px;
        color: var(--ink);
      }
      .board-row:nth-child(odd) {
        background: var(--paper);
      }
      .board-row:first-child span:first-child {
        color: var(--cy-red);
      }

      /* ---------- generated game-UI art ---------- */
      .ui-icon {
        width: 36px;
        height: 36px;
        object-fit: contain;
        display: inline-block;
        vertical-align: middle;
      }
      .mode-icon {
        width: 46px;
        height: 46px;
        object-fit: contain;
        flex: none;
      }

      /* ---------- builder mode ---------- */
      .builder-hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }
      .b-top {
        position: absolute;
        top: 14px;
        left: 16px;
        background: var(--cy-yellow);
        color: var(--ink);
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        box-shadow: var(--shadow-hard);
        padding: 8px 16px;
        transform: rotate(-1.4deg);
        transition: transform 0.12s;
      }
      .b-top.pulse {
        transform: rotate(-1.4deg) scale(1.08);
      }
      .b-gold {
        font-size: 23px;
        color: var(--ink);
      }
      .b-gold .ui-icon {
        width: 26px;
        height: 26px;
        margin: -4px 5px 0 0;
      }
      .b-goal-head .ui-icon {
        width: 22px;
        height: 22px;
        margin: -3px 4px 0 0;
      }
      .b-sub {
        font-size: 12px;
        font-family: system-ui, sans-serif;
        font-weight: 600;
        color: #4a4a4a;
      }
      .b-goal {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%) rotate(0.6deg);
        width: min(360px, 86vw);
        background: var(--paper) url("/textures/doodle-paper.webp");
        background-size: 280px;
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        padding: 10px 14px;
        box-shadow: var(--shadow-hard);
      }
      .b-goal-head {
        display: flex;
        justify-content: space-between;
        font-size: 15px;
        color: var(--ink);
      }
      .b-goal-reward {
        color: var(--cy-orange);
      }
      .b-goal-bar {
        margin-top: 6px;
        height: 12px;
        background: var(--paper-dim);
        border: 2px solid var(--ink);
        border-radius: 999px;
        overflow: hidden;
      }
      .b-goal-fill {
        height: 100%;
        width: 0;
        background: repeating-linear-gradient(
          -45deg,
          var(--cy-green),
          var(--cy-green) 8px,
          #6fd94a 8px,
          #6fd94a 16px
        );
        border-radius: 999px;
        transition: width 0.25s;
      }
      .b-goal-count {
        margin-top: 4px;
        font-size: 11px;
        font-family: system-ui, sans-serif;
        color: #8a8a8a;
        text-align: right;
      }
      .b-shop {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        pointer-events: auto;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 96vw;
      }
      /* shop buttons ride on generated crayon button plates (2:1 art) */
      .b-shop-btn {
        min-width: 132px;
        padding: 12px 18px 16px;
        border: none;
        background: transparent url("/ui/btn-green.png") center / 100% 100% no-repeat;
        color: var(--paper);
        cursor: pointer;
        font-family: inherit;
        text-align: center;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
        filter: drop-shadow(3px 4px 0 rgba(31, 31, 31, 0.5));
        transition:
          transform 0.08s,
          filter 0.08s;
      }
      .b-shop-btn:nth-child(1) {
        transform: rotate(-1deg);
      }
      .b-shop-btn:nth-child(2) {
        background-image: url("/ui/btn-blue.png");
        transform: rotate(0.8deg);
      }
      .b-shop-btn:nth-child(3) {
        background-image: url("/ui/btn-orange.png");
        transform: rotate(-0.6deg);
      }
      .b-shop-btn:nth-child(4) {
        background-image: url("/ui/btn-purple.png");
        transform: rotate(1deg);
      }
      .b-shop-btn:hover:not(:disabled) {
        transform: translate(-1px, -2px);
        filter: drop-shadow(5px 6px 0 rgba(31, 31, 31, 0.5)) brightness(1.06);
      }
      .b-shop-btn:active:not(:disabled) {
        transform: translate(1px, 2px);
        filter: drop-shadow(1px 1px 0 rgba(31, 31, 31, 0.5));
      }
      .b-shop-btn .ui-icon {
        width: 30px;
        height: 30px;
        margin-bottom: 1px;
      }
      .b-shop-btn b {
        display: block;
        font-size: 14px;
        font-weight: 400;
      }
      .b-shop-btn small {
        font-size: 11px;
        font-family: system-ui, sans-serif;
        opacity: 0.95;
      }
      .b-shop-btn:disabled {
        cursor: default;
        filter: grayscale(1) opacity(0.72) drop-shadow(2px 3px 0 rgba(31, 31, 31, 0.4));
      }
      .b-toast {
        position: fixed;
        top: 78px;
        left: 50%;
        transform: translateX(-50%) rotate(-1deg);
        background: var(--cy-yellow);
        color: var(--ink);
        padding: 10px 22px;
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        z-index: 40;
        box-shadow: var(--shadow-hard);
      }
      .b-offline-stats {
        display: flex;
        justify-content: center;
        gap: 18px;
        margin: 0 0 16px;
        font-size: 15px;
        color: var(--ink);
      }
      /* live-stream donation toast + crew-boost badge */
      .b-donor {
        top: 120px;
        background: var(--cy-pink, #e5418f);
        color: #fff;
        text-align: center;
        max-width: 340px;
        animation: donor-pop 0.4s ease-out;
      }
      .b-donor b {
        display: block;
        font-size: 15px;
        letter-spacing: 0.5px;
      }
      .b-donor-who {
        font-size: 13px;
        opacity: 0.95;
        margin-top: 2px;
      }
      .b-donor-msg {
        font-size: 12px;
        margin-top: 4px;
        word-break: break-word;
        opacity: 0.9;
      }
      @keyframes donor-pop {
        from { transform: translateX(-50%) rotate(-1deg) scale(0.7); opacity: 0; }
        to { transform: translateX(-50%) rotate(-1deg) scale(1); opacity: 1; }
      }
      .b-boost {
        position: fixed;
        top: 78px;
        right: 16px;
        z-index: 40;
        background: var(--cy-yellow);
        color: var(--ink);
        padding: 6px 14px;
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        box-shadow: var(--shadow-hard);
        font-weight: 700;
        font-size: 14px;
        transform: rotate(1.5deg);
      }

      /* ---------- craft mode ---------- */
      /* underwater: a blue wash under the HUD (the fog does the murk) */
      .craft-underwater {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 19;
        background: radial-gradient(ellipse at 50% 40%, rgba(40, 120, 200, 0.18), rgba(10, 50, 110, 0.42));
        opacity: 0;
        transition: opacity 0.15s ease-out;
      }
      .craft-underwater.on {
        opacity: 1;
      }
      .craft-hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }
      .craft-crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 26px;
        color: var(--paper);
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.65);
      }
      .craft-mine-bar {
        position: absolute;
        left: 50%;
        top: calc(50% + 22px);
        transform: translateX(-50%);
        width: 64px;
        height: 8px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        overflow: hidden;
      }
      .craft-mine-fill {
        height: 100%;
        width: 0;
        background: var(--cy-yellow);
      }
      .craft-hotbar {
        position: absolute;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        background: rgba(8, 14, 20, 0.35);
        padding: 6px;
        border-radius: 12px;
      }
      .craft-slot {
        position: relative;
        width: 52px;
        height: 52px;
        border: 3px solid var(--ink);
        border-radius: var(--wobble-sm);
        background: var(--paper);
        box-shadow: var(--shadow-soft);
      }
      .craft-slot img {
        width: 100%;
        height: 100%;
        border-radius: 8px;
        object-fit: cover;
      }
      .craft-slot.empty img {
        opacity: 0.25;
        filter: grayscale(0.8);
      }
      .craft-slot.selected {
        border-color: var(--cy-yellow);
        transform: translateY(-4px);
        box-shadow: 0 0 0 2.5px var(--ink), var(--shadow-soft);
      }
      .craft-slot-num {
        position: absolute;
        top: 1px;
        left: 4px;
        font-size: 10px;
        color: var(--ink);
        opacity: 0.7;
        z-index: 1;
      }
      .craft-slot b {
        position: absolute;
        right: 3px;
        bottom: 1px;
        font-size: 13px;
        color: var(--paper);
        text-shadow:
          -1px 0 var(--ink), 1px 0 var(--ink), 0 -1px var(--ink), 0 1px var(--ink);
      }
      .craft-help {
        position: absolute;
        bottom: 78px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
        font-family: system-ui, sans-serif;
        color: var(--paper);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        white-space: nowrap;
      }
      .craft-hint {
        position: fixed;
        left: 50%;
        top: 38%;
        transform: translateX(-50%) rotate(-1deg);
        background: var(--cy-yellow);
        color: var(--ink);
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        box-shadow: var(--shadow-hard);
        padding: 10px 24px;
        font-size: 20px;
        z-index: 25;
        pointer-events: none;
      }
      .craft-card {
        max-width: min(470px, 92vw);
        text-align: left;
      }
      .craft-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .craft-head h1 {
        font-size: 26px;
        margin: 0;
      }
      .craft-close {
        border: 3px solid var(--ink);
        border-radius: var(--wobble-sm);
        background: var(--paper);
        font-family: inherit;
        font-size: 16px;
        width: 36px;
        height: 36px;
        cursor: pointer;
        box-shadow: var(--shadow-soft);
      }
      .craft-recipes {
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: min(52vh, 420px);
        overflow-y: auto;
      }
      .craft-recipe {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        background: var(--paper);
        padding: 8px 12px;
      }
      .craft-recipe-name {
        font-size: 15px;
        min-width: 108px;
      }
      .craft-recipe-io {
        flex: 1;
        font-size: 13px;
      }
      .craft-chip {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        margin-right: 6px;
      }
      .craft-chip img {
        width: 22px;
        height: 22px;
        border-radius: 5px;
        border: 2px solid var(--ink);
      }
      .craft-btn {
        min-width: 78px;
        padding: 6px 12px;
        border: 3px solid var(--ink);
        border-radius: var(--wobble-sm);
        background: var(--cy-green);
        color: var(--paper);
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        box-shadow: var(--shadow-soft);
      }
      .craft-btn:disabled {
        background: #c9c3b6;
        color: #6f6a60;
        cursor: default;
        box-shadow: none;
      }

      /* ---------- battle mode ---------- */
      .battle-hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 20;
      }
      .battle-top {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
      }
      .battle-hearts {
        position: absolute;
        bottom: 18px;
        left: 22px;
        font-size: 26px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
        letter-spacing: 3px;
      }
      .battle-feed {
        position: absolute;
        top: 64px;
        right: 18px;
        text-align: right;
        font-size: 13px;
        color: var(--paper);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .battle-marker {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%) rotate(45deg) scale(1.35);
        font-size: 22px;
        color: #ffe36b;
        text-shadow: 0 0 6px rgba(0, 0, 0, 0.6);
      }
      .battle-marker.kill {
        color: var(--cy-red);
        transform: translate(-50%, -50%) rotate(45deg) scale(1.9);
      }
      .battle-damage-fx {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 19;
        box-shadow: inset 0 0 120px rgba(239, 58, 93, 0);
      }
      .battle-damage-fx.active {
        animation: dmg-flash 0.45s ease-out;
      }
      @keyframes dmg-flash {
        0% {
          box-shadow: inset 0 0 140px rgba(239, 58, 93, 0.85);
        }
        100% {
          box-shadow: inset 0 0 120px rgba(239, 58, 93, 0);
        }
      }
      .battle-storm-fx {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 19;
        opacity: 0;
        transition: opacity 0.4s;
        box-shadow: inset 0 0 160px rgba(138, 79, 215, 0.75);
      }
      .battle-storm-fx.active {
        opacity: 1;
      }
      .battle-end .screen-card h1 {
        font-size: 36px;
      }

      /* ---------- touch controls ---------- */
      .touch-joy-zone,
      .touch-jump-btn {
        display: none;
      }
      body.touch .touch-joy-zone {
        display: block;
        position: fixed;
        left: 0;
        bottom: 0;
        width: 38vw;
        height: 45vh;
        z-index: 25;
        touch-action: none;
      }
      body.touch .touch-joy-knob {
        position: absolute;
        left: 70px;
        bottom: 90px;
        width: 64px;
        height: 64px;
        border-radius: 47% 53% 51% 49% / 52% 48% 52% 48%;
        background: rgba(255, 255, 255, 0.55);
        border: 3px solid var(--ink);
      }
      body.touch .touch-jump-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        right: 26px;
        bottom: 70px;
        width: 84px;
        height: 84px;
        border-radius: 47% 53% 51% 49% / 52% 48% 52% 48%;
        background: var(--cy-green);
        border: 3px solid var(--ink);
        box-shadow: var(--shadow-hard);
        color: var(--paper);
        font-family: "Jua", system-ui, sans-serif;
        font-size: 18px;
        z-index: 25;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      /* ---------------------------------------------------------------
         Home notice board (#mode-select only): a wooden board with brick
         studs on top, a cork panel, and the modes pinned on it as photo
         notes. The class lobby reuses .screen-card/.mode-btn unchanged.
         --------------------------------------------------------------- */
      #mode-select .board {
        --wood: #c98a4b;
        --wood-dark: #a8682f;
        --cork: #e8c58c;
        position: relative;
        width: min(620px, calc(100vw - 24px));
        max-width: none;
        max-height: calc(100dvh - 24px);
        padding: 26px 18px 14px;
        border-width: 4px;
        border-radius: 22px 26px 20px 28px / 26px 20px 28px 22px;
        background:
          repeating-linear-gradient(176deg, rgba(255, 255, 255, 0.07) 0 3px, transparent 3px 19px),
          repeating-linear-gradient(4deg, rgba(90, 45, 10, 0.1) 0 2px, transparent 2px 27px),
          linear-gradient(180deg, var(--wood), var(--wood-dark));
        box-shadow: 0 8px 0 #6f3f17, 8px 14px 0 rgba(31, 31, 31, 0.35);
        transform: rotate(-0.4deg);
        overflow-y: auto;
        scrollbar-width: thin;
      }
      #mode-select .board::before {
        /* studs along the top edge, like the brick UI in game */
        content: "";
        position: absolute;
        top: 6px;
        left: 34px;
        right: 34px;
        height: 18px;
        background: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2744%27%20height%3D%2718%27%20viewBox%3D%270%200%2044%2018%27%3E%3Cpath%20d%3D%27M10%206v6a12%205%200%200%200%2024%200V6%27%20fill%3D%27%238f5524%27%20stroke%3D%27%231f1f1f%27%20stroke-width%3D%272%27%2F%3E%3Cellipse%20cx%3D%2722%27%20cy%3D%276%27%20rx%3D%2712%27%20ry%3D%275%27%20fill%3D%27%23e9ad6c%27%20stroke%3D%27%231f1f1f%27%20stroke-width%3D%272%27%2F%3E%3Cellipse%20cx%3D%2718%27%20cy%3D%275%27%20rx%3D%274%27%20ry%3D%271.6%27%20fill%3D%27%23fff%27%20opacity%3D%27.45%27%2F%3E%3C%2Fsvg%3E") 0 0 / 44px 18px space no-repeat;
        pointer-events: none;
      }
      #mode-select .brand-logo {
        width: min(210px, 52vw);
        margin: -8px auto -4px;
        position: relative;
        z-index: 1;
        filter: drop-shadow(0 4px 0 rgba(31, 31, 31, 0.35));
      }
      #mode-select .board-sign {
        position: relative;
        margin: 0 auto 12px;
        max-width: 470px;
        padding: 10px 18px 11px;
        border: 3px solid var(--ink);
        border-radius: var(--wobble-md);
        background: var(--paper) url("/textures/doodle-paper.webp");
        background-size: 280px;
        box-shadow: var(--shadow-soft);
        transform: rotate(0.6deg);
      }
      #mode-select .board-sign::before,
      #mode-select .board-sign::after {
        /* two nails holding the sign */
        content: "";
        position: absolute;
        top: 9px;
        width: 9px;
        height: 9px;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: #9aa3ad;
      }
      #mode-select .board-sign::before { left: 10px; }
      #mode-select .board-sign::after { right: 10px; }
      #mode-select .board-sign .game-brand { margin: 0 0 2px; font-size: 25px; }
      #mode-select .board-sign .game-intro { margin: 0; font-size: 13.5px; color: #4f4f4f; }
      /* the game list is the second page of the board: drop the header so all four fit */
      #mode-select[data-step="games"] .board-head { display: none; }
      #mode-select .board-cork {
        padding: 14px 14px 12px;
        border: 3px solid var(--ink);
        border-radius: 14px 18px 12px 16px / 16px 12px 18px 14px;
        background:
          radial-gradient(circle at 20% 30%, rgba(150, 95, 35, 0.32) 0 1.2px, transparent 1.6px) 0 0 / 13px 11px,
          radial-gradient(circle at 70% 65%, rgba(255, 245, 220, 0.45) 0 1px, transparent 1.5px) 0 0 / 17px 15px,
          radial-gradient(circle at 40% 80%, rgba(120, 70, 20, 0.22) 0 1.6px, transparent 2px) 0 0 / 23px 19px,
          var(--cork);
        box-shadow: inset 0 3px 0 rgba(90, 45, 10, 0.25), inset 0 -2px 0 rgba(255, 255, 255, 0.35);
      }
      #mode-select .mode-step h2 {
        display: inline-block;
        margin: 0 0 12px;
        padding: 3px 14px 4px;
        border: 2px solid var(--ink);
        border-radius: var(--wobble-sm);
        background: var(--cy-yellow);
        box-shadow: var(--shadow-soft);
        font-size: 19px;
        transform: rotate(-1deg);
      }
      #mode-select .play-kicker {
        margin: -2px 0 12px;
        color: #5b3a17;
      }

      /* the latest dev note, pinned at the top of the cork */
      #mode-select .board-news {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 14px;
        padding: 7px 10px;
        border: 2px solid var(--ink);
        border-radius: var(--wobble-sm);
        background: #fff7c7;
        box-shadow: var(--shadow-soft);
        color: var(--ink);
        text-decoration: none;
        text-align: left;
        font: 600 12.5px/1.35 system-ui, sans-serif;
        transform: rotate(0.4deg);
        transition: transform 0.08s, box-shadow 0.08s;
      }
      #mode-select .board-news[hidden] { display: none; }
      #mode-select .board-news:hover { transform: translate(-1px, -2px); box-shadow: 4px 5px 0 rgba(31, 31, 31, 0.8); }
      #mode-select .board-news-tag {
        flex: none;
        padding: 2px 8px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--cy-red);
        color: var(--paper);
        font: 13px "Jua", system-ui, sans-serif;
      }
      #mode-select .board-news-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #mode-select .board-news-go { flex: none; font-size: 15px; }

      /* photo notes */
      #mode-select .board-notes {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px 14px;
        margin-bottom: 4px;
      }
      #mode-select .board-note {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        margin: 0;
        padding: 8px 8px 11px;
        border: 3px solid var(--ink);
        border-radius: 6px 8px 5px 9px;
        background: var(--paper);
        box-shadow: 0 2px 0 rgba(31, 31, 31, 0.15), 4px 6px 0 rgba(60, 30, 5, 0.45);
        text-align: left;
        transform: rotate(-1.4deg);
        transition: transform 0.12s, box-shadow 0.12s;
      }
      #mode-select .board-note:nth-child(2n) { transform: rotate(1.2deg); }
      #mode-select .board-note:nth-child(3) { transform: rotate(0.8deg); }
      #mode-select .board-note:nth-child(4) { transform: rotate(-0.9deg); }
      #mode-select .board-note::before {
        /* push pin */
        content: "";
        position: absolute;
        z-index: 2;
        top: -9px;
        left: 50%;
        width: 16px;
        height: 16px;
        margin-left: -8px;
        border: 2.5px solid var(--ink);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.75) 0 2.5px, transparent 3px), var(--pin, var(--cy-red));
        box-shadow: 1px 2px 0 rgba(31, 31, 31, 0.45);
      }
      #mode-select .board-note[data-pick="games"],
      #mode-select .board-note[data-mode="tower"] { --pin: var(--cy-blue); }
      #mode-select .board-note[data-mode="builder"] { --pin: var(--cy-green); }
      #mode-select .board-note[data-mode="battle"] { --pin: var(--cy-purple); }
      #mode-select .board-note:hover,
      #mode-select .board-note:focus-visible {
        transform: translateY(-4px) rotate(0deg);
        box-shadow: 0 2px 0 rgba(31, 31, 31, 0.15), 6px 10px 0 rgba(60, 30, 5, 0.45);
        outline: none;
      }
      #mode-select .board-note:focus-visible { outline: 3px solid var(--cy-blue); outline-offset: 3px; }
      #mode-select .board-note:active {
        transform: translateY(1px) rotate(0deg);
        box-shadow: 0 1px 0 rgba(31, 31, 31, 0.15), 2px 2px 0 rgba(60, 30, 5, 0.45);
      }
      #mode-select .board-photo {
        display: block;
        overflow: hidden;
        aspect-ratio: 4 / 3;
        border: 2px solid var(--ink);
        border-radius: 3px;
        background: #9bd7ec;
      }
      #mode-select .board-photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.25s;
      }
      #mode-select .board-note:hover .board-photo img { transform: scale(1.06); }
      #mode-select .board-note .mode-text { display: block; padding: 8px 3px 0; }
      #mode-select .board-note .mode-text b { font-size: 20px; line-height: 1.15; color: var(--cy-blue); }
      #mode-select .board-note[data-pick="games"] .mode-text b,
      #mode-select .board-note[data-mode="builder"] .mode-text b { color: var(--cy-green); }
      #mode-select .board-note[data-mode="battle"] .mode-text b { color: var(--cy-purple); }
      #mode-select .board-note[data-mode="tower"] .mode-text b { color: var(--cy-orange); }
      #mode-select .board-note .mode-text small {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        line-height: 1.4;
        color: #5f5f5f;
        word-break: keep-all;
      }
      #mode-select .board-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        padding: 8px 2px 0;
      }
      #mode-select .board-chips i {
        padding: 2px 8px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: #f3fbef;
        color: var(--ink);
        font: 600 11px/1.3 system-ui, sans-serif;
        font-style: normal;
      }
      #mode-select [data-pick="games"] .board-chips i { background: #eaf3ff; }
      #mode-select .board-go {
        align-self: flex-start;
        margin: 10px 2px 0;
        padding: 5px 13px 6px;
        border: 2px solid var(--ink);
        border-radius: var(--wobble-sm);
        background: var(--cy-yellow);
        box-shadow: 0 3px 0 var(--ink);
        color: var(--ink);
        font: 15px "Jua", system-ui, sans-serif;
      }
      #mode-select [data-pick="games"] .board-go { background: #9fd1ff; }
      #mode-select .board-notes-4 .board-note { padding-bottom: 9px; }
      #mode-select .board-notes-4 .mode-text b { font-size: 17px; }
      #mode-select .board-notes-4 .mode-text small { font-size: 11.5px; }
      #mode-select .mode-back {
        margin-top: 12px;
        color: #4a2c0f;
        border-bottom-color: #8a5a2b;
      }
      #mode-select .board-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: 12px 0 0;
      }
      #mode-select .board-links .desk-link {
        margin: 0;
        padding: 5px 11px;
        border: 2px solid var(--ink);
        border-radius: var(--wobble-sm);
        background: var(--paper-dim);
        box-shadow: 0 3px 0 var(--ink);
        color: var(--ink);
        font: 600 12px system-ui, sans-serif;
      }
      #mode-select .board-links .desk-link:hover { background: var(--paper); transform: translateY(-1px); }
        @media (max-width: 560px) {
        /* clear the 배경 멈추기 button in the top-right corner */
        #mode-select .board { padding: 24px 10px 12px; margin-top: 44px; max-height: calc(100dvh - 54px); }
        #mode-select .board::before { left: 22px; right: 22px; }
        #mode-select .board-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        #mode-select .board-head .brand-logo { flex: none; width: 108px; margin: -4px 0 -6px; }
        #mode-select .board-head .board-sign { flex: 1; margin: 0; padding: 8px 10px 9px; text-align: left; }
        #mode-select .board-head .board-sign::before,
        #mode-select .board-head .board-sign::after { display: none; }
        #mode-select .board-sign .game-brand { font-size: 20px; }
        #mode-select .board-sign .game-intro { font-size: 11.5px; }
        #mode-select .board-cork { padding: 12px 9px 10px; }
        /* the two modes become wide notes: photo left, words right */
        #mode-select .board-notes-2 { grid-template-columns: 1fr; gap: 14px; }
        #mode-select .board-notes-2 .board-note {
          display: grid;
          grid-template-columns: 38% 1fr;
          grid-template-rows: auto auto 1fr;
          column-gap: 10px;
        }
        #mode-select .board-notes-2 .board-photo { grid-row: 1 / 4; align-self: start; }
        #mode-select .board-notes-2 .mode-text { padding: 2px 0 0; }
        #mode-select .board-notes-2 .mode-text b { font-size: 19px; }
        #mode-select .board-notes-2 .board-chips { display: none; }
        #mode-select .board-notes-2 .board-go { margin-top: 6px; padding: 3px 11px 4px; font-size: 14px; }
        #mode-select .board-notes-4 { gap: 14px 10px; }
        #mode-select .board-notes-4 .board-note { padding: 6px 6px 8px; }
        #mode-select .board-notes-4 .mode-text { padding-top: 6px; }
        #mode-select .board-notes-4 .mode-text b { font-size: 15.5px; }
      }
      @media (max-height: 820px) and (min-width: 561px) {
        /* laptops: logo beside the sign, wider board, shorter photos */
        #mode-select .board { width: min(760px, calc(100vw - 24px)); padding-top: 22px; }
        #mode-select .board-head { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
        #mode-select .board-head .brand-logo { flex: none; width: 150px; margin: -4px 0 -6px; }
        #mode-select .board-head .board-sign { flex: 1; margin: 0; text-align: left; }
        #mode-select .board-head .board-sign::before { display: none; }
        #mode-select .board-news { margin-bottom: 10px; }
        #mode-select .mode-step h2 { margin-bottom: 10px; }
        #mode-select .board-photo { aspect-ratio: 16 / 9; }
        #mode-select .board-chips { display: none; }
      }
      @media (max-height: 720px) and (min-width: 561px) {
        #mode-select .board-photo { aspect-ratio: 2 / 1; }
        #mode-select .board-note .mode-text small { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        #mode-select .board-note,
        #mode-select .board-photo img { transition: none; }
      }

    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="menu-backdrop" hidden aria-hidden="true">
      <video id="menu-background-video" muted loop playsinline preload="none" tabindex="-1" disablepictureinpicture disableremoteplayback></video>
    </div>
    <button id="menu-motion-toggle" type="button" hidden aria-pressed="false">배경 멈추기</button>
    <main id="mode-select" class="screen mode-screen">
      <div class="screen-card board">
        <div class="board-head">
        <img class="brand-logo" src="/craftyap-logo.png" alt="크래프트얍 CraftYap" />
        <div class="board-sign">
          <h1 class="game-brand">크래프트얍 <span>CraftYap</span></h1>
          <p class="game-intro">설치 없이 즐기는 무료 3D 블록 게임<br />블록으로 세상을 만들고, 자동차와 비행기를 조립해요.</p>
        </div>
        </div>
        <div class="board-cork">
          <a class="board-news" href="/note/" hidden>
            <span class="board-news-tag">새 소식</span>
            <span class="board-news-title">개발 노트</span>
            <span class="board-news-go" aria-hidden="true">&rarr;</span>
          </a>
          <div class="mode-step" data-step="category">
            <h2>어떤 모드로 할까요?</h2>
            <div class="board-notes board-notes-2">
              <button class="mode-btn board-note" data-pick="field" type="button">
                <span class="board-photo"><img src="/home/education.webp" width="480" height="360" alt="" /></span>
                <span class="mode-text"><b>교육 모드</b><small>끝없는 들판에서 자유롭게 만들고, 같은 교실에서 함께 건축해요</small></span>
                <span class="board-chips"><i>🏫 교실</i><i>🌱 끝없는 들판</i></span>
                <span class="board-go">시작하기 <span aria-hidden="true">&rarr;</span></span>
              </button>
              <button class="mode-btn board-note" data-pick="games" type="button">
                <span class="board-photo"><img src="/home/games.webp" width="480" height="360" alt="" /></span>
                <span class="mode-text"><b>게임 모드</b><small>블록 섬 탐험, 점프 타워, 랜드마크 건설, 로봇 배틀로얄</small></span>
                <span class="board-chips"><i>🎮 게임 4가지</i><i>👫 멀티플레이</i></span>
                <span class="board-go">골라 보기 <span aria-hidden="true">&rarr;</span></span>
              </button>
            </div>
          </div>
          <div class="mode-step" data-step="games" hidden>
            <h2>어떤 게임을 할까요?</h2>
            <p class="play-kicker">Craft Island 기계 작업실에서 자동차와 비행기를 만들고 직접 움직여 보세요</p>
            <div class="board-notes board-notes-4">
              <button class="mode-btn board-note" data-mode="craft" type="button">
                <span class="board-photo"><img src="/home/craft.webp" width="480" height="360" alt="" loading="lazy" /></span>
                <span class="mode-text"><b>Craft Island</b><small>블록을 캐고 집을 짓고, 기계를 조립하는 샌드박스</small></span>
              </button>
              <button class="mode-btn board-note" data-mode="tower" type="button">
                <span class="board-photo"><img src="/home/tower.webp" width="480" height="360" alt="" loading="lazy" /></span>
                <span class="mode-text"><b>Daily Tower</b><small>매일 새로운 멀티플레이 점프 타워에 도전해요</small></span>
              </button>
              <button class="mode-btn board-note" data-mode="builder" type="button">
                <span class="board-photo"><img src="/home/builder.webp" width="480" height="360" alt="" loading="lazy" /></span>
                <span class="mode-text"><b>Robo Builder</b><small>로봇들이 세계의 랜드마크를 짓는 방치형 건설 게임</small></span>
              </button>
              <button class="mode-btn board-note" data-mode="battle" type="button">
                <span class="board-photo"><img src="/home/battle.webp" width="480" height="360" alt="" loading="lazy" /></span>
                <span class="mode-text"><b>Blast Royale</b><small>로봇들과 마지막까지 살아남는 배틀로얄</small></span>
              </button>
            </div>
            <button class="desk-link mode-back" type="button">&larr; 모드 선택으로</button>
          </div>
        </div>
        <p class="game-help board-links"><a class="desk-link" href="/guide/">📖 게임 소개 · 조작법 · 자주 묻는 질문</a><a class="desk-link" href="/note/">📝 개발 노트</a></p>
        <noscript>
          <p class="game-intro">게임을 시작하려면 JavaScript를 켜 주세요. 게임 소개와 조작법은 JavaScript 없이도 읽을 수 있어요.</p>
        </noscript>
      </div>
    </main>
    <div id="boot-overlay">
      <img class="brand-logo" src="/craftyap-logo.png" alt="CraftYap" />
      <div class="spinner"></div>
      <div id="boot-message">Loading…</div>
      <button id="boot-retry">Retry</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
