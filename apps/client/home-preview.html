<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>HOME Character Review · CraftYap Dev</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f8f4e9;color:#27332c}canvas{display:block}header{position:fixed;left:20px;top:20px;max-width:340px;padding:18px;background:#fffdf5ed;border:1px solid #cfd6c5;border-radius:18px;box-shadow:0 6px 28px #263a2514}h1{font-size:22px;margin:0 0 5px}p{font-size:13px;margin:0 0 16px;color:#5e6b60}label{display:block;font-size:12px;margin-top:12px;color:#526050}select,button{font:inherit;border:1px solid #b9c7b0;border-radius:9px;background:#fffdf5;color:#27332c;padding:8px 10px}select{display:block;width:100%;margin-top:4px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}button{cursor:pointer;font-size:12px}button:hover{background:#dfe8ce}.check{display:flex;gap:7px;align-items:center}footer{position:fixed;left:20px;bottom:16px;font-size:12px;max-width:calc(100% - 40px);background:#fffdf5e8;border:1px solid #cfd6c5;border-radius:10px;padding:10px 13px}a{color:#355e39}@media(max-width:600px){header{left:12px;top:12px;padding:12px;max-width:245px}h1{font-size:18px}p{margin-bottom:9px}footer{left:12px;bottom:10px}}
details>summary{font-size:13px;font-weight:600;cursor:pointer;list-style-position:inside}details[open]>summary{margin-bottom:5px}header{max-width:300px}header>p{margin-bottom:10px}@media(max-width:800px){header{padding:12px 16px;max-width:280px}h1{font-size:18px}header>p{font-size:11px}}</style></head><body><div id="app"></div><header><h1>HOME · Animation Review</h1><p>Relaxed arms · breathing · curious idle</p><details id="home-controls" open><summary>Motion &amp; appearance</summary><label>Motion<select id="home-motion"><option value="Idle">Idle · natural</option><option value="IdleShift">Idle · weight shift</option><option value="IdleLook">Idle · look around</option><option>Walk</option><option>Run</option><option>Wave</option><option>Jump</option><option>Fall</option><option>Land</option><option>Carry</option><option>Hold</option><option>Place</option><option>Sit</option></select></label><label>Face<select id="home-expression"><option value="neutral">Neutral</option><option value="auto" selected>Auto blink</option><option value="blink">Blink</option><option value="happy">Happy</option><option value="hurt">Hurt</option></select></label><div class="row"><button id="home-jump">Jump test · Space</button><button id="home-pause">Pause</button><button data-home-view="game">Game view</button><button data-home-view="front">Front</button><button data-home-view="side">Side</button><button data-home-view="back">Back</button></div><label>Playback <span id="home-speed-label">1.00×</span><input id="home-speed" aria-label="Playback speed" type="range" min="0.25" max="1.5" step="0.05" value="1" style="width:100%"></label><label class="check"><input id="home-travel" type="checkbox">Travel preview</label><label class="check"><input id="home-follow" type="checkbox" checked>Follow movement</label><label class="check"><input id="home-turntable" type="checkbox">Turntable</label><p style="margin:12px 0 0">Drag: rotate · Wheel: zoom<br>WASD: move · Shift: run · Space: jump</p><div class="row"><a href="/?preview=char">Existing character review</a></div></details></header><footer id="home-status">Loading HOME model…</footer><script type="module">document.getElementById('home-controls').open=innerWidth>800;import { bootHomePreview } from '/src/app/homePreview.ts'; bootHomePreview(document.getElementById('app')).catch(error=>{document.getElementById('home-status').textContent='Could not load HOME: '+error.message;console.error(error);});</script></body></html>
