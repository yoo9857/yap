<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CraftYap · 조립 블록</title><style>

ft:22px;bottom:18px;font-size:12px;padding:11px 15px;background:#fffdf4df;border:1px solid #fff;border-radius:11px;color:#526b55;max-width:calc(100% - 44px)}@media(max-width:700px){header{height:68px;padding:10px 16px}h1{font-size:18px}header a{font-size:11px}.layout{grid-template-columns:160px 1fr;height:calc(100dvh - 68px)}aside{padding:16px 9px}#kit-list button{font-size:11px;padding:8px}.bar{left:10px;right:10px}.bar span{display:none}.kit-name{font-size:9px;padding:3px 6px}footer{left:12px;bottom:12px;font-size:10px}}
</style></head><body><header><div><h1>CraftYap · 조립 블록</h1><p>자연형 블록 · 재료별 형태 · 기존 조립형과 비교</p></div><a href="/?mode=craft" id="kit-game">게임에서 조립 →</a></header><div class="layout"><aside><p class="caption">BASIC BUILDING KIT</p><button id="kit-all" type="button" style="width:100%">전체 비교</button><label style="display:block;margin-top:14px;font-size:12px">연결 검수<select id="kit-connection" style="width:100%;padding:9px;border-radius:8px;border:1px solid #c4d3c0;margin-top:6px;background:#fffdf7"><option value="">단일 부품</option><option value="vertical">위·아래</option><option value="horizontal">좌·우</option><option value="depth">앞·뒤</option><option value="stairs">계단 단차</option><option value="inside">안쪽 모서리</option><option value="six-way">6방향 교차</option><option value="arch">아치·아랫면</option><option value="courtyard">속이 빈 코너</option><option value="mixed">다른 재료 경계</option></select></label><label style="display:block;margin-top:14px;font-size:12px">디자인<select id="kit-design" style="width:100%;padding:9px;border-radius:8px;border:1px solid #c4d3c0;margin-top:6px;background:#fffdf7"><option value="nature">자연형 v4</option><option value="kit">기존 조립형</option></select></label><label style="display:block;margin-top:14px;font-size:12px">재료 비교<select id="kit-material" style="width:100%;padding:9px;border-radius:8px;border:1px solid #c4d3c0;margin-top:6px;background:#fffdf7"><option value="coat">조립 블록</option><option value="snow">눈 · 포슬한 무광</option><option value="grass" selected>잔디 · 초록 윗면과 흙</option><option value="dirt">흙 · 거친 알갱이</option><option value="diamond-block">보석 · 결정과 반사</option></select></label><div style="display:grid;gap:7px;margin-top:10px"><button id="kit-reset" type="button">기본방향</button><button id="kit-bottom" type="button">하부 보기</button><button id="kit-uv" type="button">UV 격자</button></div><div id="kit-list"></div><p class="hint">1칸 높이의 공통 규격입니다.<br>판은 가로·세로로 넓게 조합합니다.<br><br>드래그: 회전 · 휠: 확대<br>아래쪽까지 돌려 하부 홈을 확인하세요<br>게임: F 모양 · R 회전 · T 기울이기<br>Shift+R: 기본방향 복원<br>재료마다 무늬·굴곡·반사광이 다릅니다.</p></aside><main><div id="kit-stage"></div><div id="kit-labels"></div><div class="bar"><span>12 SHAPES · ONE GRID</span><div class="actions"><button id="kit-rotate" type="button">R 회전</button><button id="kit-tilt" type="button">T 기울이기</button></div></div><footer id="kit-status">12종을 같은 격자 크기로 비교합니다.</footer></main></div><script type="module">import {bootBlockReview} from '/src/app/blockReview.ts';bootBlockReview(document.getElementById('kit-stage'));if(location.protocol==='file:')document.getElementById('kit-game').hidden=true;</script></body></html>
