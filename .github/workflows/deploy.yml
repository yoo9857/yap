name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-craftyap
  cancel-in-progress: false

jobs:
  # Nothing reaches the server without green gates.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Requires one repository secret (Settings → Secrets and variables →
    # Actions).  Same server/key family as poke:
    #   DEPLOY_SSH_KEY - private key authorized for root@172.236.235.9
    #   (the matching server-side entry is labelled github-actions-deploy)
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host keys are PUBLIC - publishing them is exactly what an SSHFP DNS
          # record does - so they are pinned here instead of held in a secret.
          # They used to come from DEPLOY_KNOWN_HOSTS, and once that secret went
          # stale every deploy died in well under a second inside host-key
          # verification: before authentication, so the runner log showed nothing
          # but a bare non-zero exit while the server logged only
          # "Connection closed [preauth]".  Pinning keeps StrictHostKeyChecking=yes
          # exactly as strict, and turns a server rebuild into a reviewable diff
          # instead of a silent outage.
          # Refresh with: ssh-keyscan -t ed25519,rsa 172.236.235.9
          {
            echo '172.236.235.9 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGFT3sc3gO8dHCXrlAr8CuIXBY9UIJQr3R29YP9/ZDmz'
            echo '172.236.235.9 ssh-rsa '
          } > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Split out of the deploy itself so the log names the wall it hit: an
      # unreachable host, a rejected key and a failed build are three very
      # different problems that used to look identical from the runner.
      - name: Check the server accepts the deploy key
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o BatchMode=yes root@172.236.235.9 'echo "ssh ok: $(hostname)"'

      - name: Deploy on the server (build image, reload nginx, health-check)
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes root@172.236.235.9 '
            set -euo pipefail
            cd /srv/craftyap/app

            # pull the pushed commit
            git fetch origin
            git reset --hard origin/main

            # snapshot the live DB BEFORE anything restarts — the rollback point
            # for saved classrooms and the leaderboard. Aborts the deploy if the
            # snapshot cannot be taken. (/srv/craftyap/data/pre-deploy/)
            bash scripts/pre-deploy-backup.sh

            # rebuild + restart the single-port container (static + WS + SQLite).
            # The separate SQLite DB is bind-mounted from /srv/craftyap/data and
            # is never touched by a rebuild.
            docker compose build
            # Do not interrupt an active classroom while changing protocol.
            bash scripts/wait-idle.sh
            docker compose up -d --no-build

            # keep the nginx vhost in sync with the repo (validated before reload).
            # NOTE: the TLS cert must already exist from the one-time bootstrap
            # (see DEPLOY_KO.md §4) or nginx -t will fail here.
            cp ops/nginx/craftyap.com.conf /etc/nginx/sites-available/craftyap.com.conf
            nginx -t
            systemctl reload nginx

            # the app needs a few seconds after recreate — retry the health check
            ok=""
            for i in $(seq 1 20); do
              if curl -fsS -o /dev/null http://127.0.0.1:8082/healthz; then ok=1; break; fi
              sleep 3
            done
            [ -n "$ok" ] || { echo "health check failed"; docker compose logs --tail=40 app; exit 1; }
            echo "deploy complete: $(git rev-parse --short HEAD)"
          '
