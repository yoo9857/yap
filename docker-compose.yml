# CraftYap — runs alongside the existing poke stack on the same host.
# Isolation from poke: own project name, own host port, own bind-mounted DB.
#   deploy:  docker compose up -d --build
name: craftyap

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    # host-only bind (nginx on the host reverse-proxies craftyap.com → here).
    # 8082 keeps clear of poke's 3000. Change HOST_PORT in .env to remap.
    ports:
      - "127.0.0.1:${HOST_PORT:-8082}:8081"
    # SEPARATE database, managed on the host filesystem — never shared with
    # poke. Back up / wipe this directory independently. The daily-tower
    # leaderboard SQLite (records.db + WAL) lives here.
    volumes:
      - ${DB_DIR:-/srv/craftyap/data}:/app/apps/server/data
    # Game processes follow the machine (docs/SCALING.md): SHARDS=auto reads the
    # cores, CPU quota and memory limit this container gets at boot — 1 core runs
    # the single process, 2+ cores a shard per core. Resizing the server needs no
    # change here. No hard `cpus:` on purpose: a value above the host's cores makes
    # docker refuse to start the container at all. To cap CPU, set it in .env
    # (CPU_LIMIT, below the host's core count) and add `cpus: ${CPU_LIMIT}`.
    environment:
      SHARDS: ${SHARDS:-auto}
      # Class water engine (docs/ENGINE.md): ts (the reference) or rust. Same water either way;
      # a failing Rust engine falls back per class and logs it. Switch with FLUID_ENGINE in .env.
      FLUID_ENGINE: ${FLUID_ENGINE:-ts}
    # ~80 MiB primary + 150 MiB per shard; auto never starts more than this holds
    mem_limit: ${MEM_LIMIT:-768m}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
